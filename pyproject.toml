[project]
name = "ispunet"
version = "1.0.0"
description = "ISPUNet — Kualitas udara / ISPU Indonesia (KLHK). Library, REST API, CLI, dan skill untuk OpenClaw & Hermes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hanafi" }]
keywords = ["ispu", "air-quality", "klhk", "indonesia", "pollution"]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
ispunet = "ispunet.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ispunet"]
